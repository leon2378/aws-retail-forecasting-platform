version: 0.2
phases:
  build:
    commands:
      - |
        set -eu
        python -c 'import hashlib,json,pathlib; p=pathlib.Path("build/lambda.zip"); m=json.loads(pathlib.Path("build/manifest.json").read_text()); assert hashlib.sha256(p.read_bytes()).hexdigest()==m["lambda.zip"]["sha256"]'
        for component in api worker outbox drill; do
          aws lambda update-function-code --function-name "$PROJECT_NAME-$component" --zip-file fileb://build/lambda.zip
          aws lambda wait function-updated --function-name "$PROJECT_NAME-$component"
        done
      - aws s3 sync frontend/ "s3://$FRONTEND_BUCKET/" --cache-control max-age=300
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
