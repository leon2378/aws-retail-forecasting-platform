version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20
    commands:
      - python -m pip install '.[aws]'
      - |
        TERRAFORM_VERSION=1.11.4
        curl --fail --silent --show-error -O "https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
        curl --fail --silent --show-error -o terraform.sha256 "https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
        grep " terraform_${TERRAFORM_VERSION}_linux_amd64.zip$" terraform.sha256 | sha256sum --check
        unzip "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -d /usr/local/bin
  build:
    commands:
      - python -m unittest discover -s tests -p 'test_*.py'
      - python -S -m orderflow rehearse --output build/reliability-report.json
      - node --test tests/*.test.mjs
      - python -m aws.package
      - terraform -chdir=infra fmt -check
      - terraform -chdir=infra init -backend=false -lockfile=readonly
      - terraform -chdir=infra validate
      - terraform -chdir=infra test
artifacts:
  files:
    - build/lambda.zip
    - build/manifest.json
    - build/reliability-report.json
    - frontend/**/*
    - aws/buildspec-deploy.yml
