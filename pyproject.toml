[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow"
version = "1.0.0"
description = "Order processing, inventory reservations and failure recovery on AWS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]

[project.scripts]
orderflow = "orderflow.cli:main"

[tool.setuptools.packages.find]
include = ["orderflow*", "aws*"]
